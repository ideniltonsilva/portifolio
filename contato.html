<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>

    <!-- Importa o arquivo CSS externo para estilização -->
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <!-- Menu fixo -->
    <div id="menu">
        <a href="sobre.html">Sobre  mim</a> <!-- Link Sobre Mim -->
        <a href="formacao.html">Formação</a> <!-- Link Formação -->
        <a href="portifolio.html">Portifólio</a> <!-- Link Portfólio -->
        <a href="contato.html">Contato</a> <!-- Link Contato -->
    </div>

    <!-- Conteúdo principal da página -->
    <main>
        <form id="contatoForm">
            <label for="nome">Nome:</label><br>
            <input type="text" id="nome" name="nome"><br>
            <span id="errorNome" style="color:red; display:none;">Por favor, preencha seu nome.</span><br>

            <label for="email">E-mail:</label><br>
            <input type="text" id="email" name="email"><br>
            <span id="errorEmail" style="color:red; display:none;">Por favor, preencha um e-mail válido.</span><br>

            <label for="mensagem">Mensagem:</label><br>
            <textarea id="mensagem" name="mensagem" rows="5"></textarea><br>
            <span id="errorMensagem" style="color:red; display:none;">Por favor, escreva sua mensagem.</span><br><br>

            <button type="submit">Enviar</button>
        </form>
    </main>

    <script>
        document.getElementById('contatoForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Evita envio real do formulário

            // Obter valores
            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const mensagem = document.getElementById('mensagem').value.trim();

            let valid = true;

            // Validação Nome
            if (nome === "") {
                document.getElementById('errorNome').style.display = 'inline';
                valid = false;
            } else {
                document.getElementById('errorNome').style.display = 'none';
            }

            // Validação E-mail simples
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                document.getElementById('errorEmail').style.display = 'inline';
                valid = false;
            } else {
                document.getElementById('errorEmail').style.display = 'none';
            }

            // Validação Mensagem
            if (mensagem === "") {
                document.getElementById('errorMensagem').style.display = 'inline';
                valid = false;
            } else {
                document.getElementById('errorMensagem').style.display = 'none';
            }

            // Se válido, simular envio
            if (valid) {
                alert(`Mensagem enviada com sucesso!\n\nNome: ${nome}\nE-mail: ${email}\nMensagem: ${mensagem}`);
                document.getElementById('contatoForm').reset();
            }
        });
    </script>


    <footer class="rodape">
      <p>&copy; 2025 | Desenvolvido por Idenilton F. Silva</p>
    </footer>

  </body>
</html>
